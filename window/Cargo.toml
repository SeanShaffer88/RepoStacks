[package]
name = "repostacks-window"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "RepoStacks window — the dark ledger over the RepoStacks core."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
repostacks_core = { package = "repostacks", path = ".." }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
# Used for production builds: serves the bundled UI from inside the binary
# instead of a dev server. The release pipeline builds with this feature.
custom-protocol = ["tauri/custom-protocol"]
